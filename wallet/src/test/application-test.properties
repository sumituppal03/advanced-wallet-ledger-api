# Use an in-memory H2 database for testing instead of real PostgreSQL
spring.datasource.url=jdbc:h2:mem:wallet_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Automatically generate tables from @Entity definitions
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Mock key to satisfy Spring AI validators
spring.ai.openai.api-key=gsk_v1_mockkeyforcitestingenvironmentpurposesonly12345