name: Java CI/CD Pipeline with Maven

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out the repository code onto the runner
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Set up JDK 21 environment
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    # 3. Compile code and run all backend tests (CI)
    - name: Build and Test with Maven
      run: mvn clean verify

    # 4. Trigger Deployment to Render (CD)
    # This step ONLY runs if the build and test step above finishes successfully!
    - name: Deploy to Render
      if: success()
      run: |
        curl -X POST "https://api.render.com/deploy/srv-d8l5ko3eo5us73b46co0?key=riJPaWRZBy4"