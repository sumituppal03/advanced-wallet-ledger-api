name: Java CI/CD Pipeline with Maven

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    # 1. Check out the repository code onto the runner
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Set up JDK 21 environment (Updated for your project)
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: 'maven'

    # 3. Compile code and run all backend tests
    - name: Build and Test with Maven
      run: mvn clean verify